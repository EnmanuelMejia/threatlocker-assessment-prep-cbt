<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
  <title>Attack graph: shortest path to the crown jewels</title>
  <desc>Four nodes in a chain: external attacker, VPN gateway with a remote-exploit flaw, file server with weak credentials, and the customer database labeled crown jewel. The edges are labeled with exploit steps. A secondary branch from the gateway to a printer shows a dead-end path.</desc>
  <rect x="0" y="0" width="720" height="360" fill="#f7f9fc"/>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a2333">Attack graph: shortest path to the crown jewels</text>
  <defs>
    <marker id="sap-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="sap-arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="150" y1="150" x2="280" y2="150" stroke="#b91c1c" stroke-width="3" marker-end="url(#sap-arrow)"/>
  <text x="215" y="138" font-family="sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle">exploit RCE flaw</text>
  <line x1="390" y1="150" x2="520" y2="150" stroke="#b91c1c" stroke-width="3" marker-end="url(#sap-arrow)"/>
  <text x="455" y="138" font-family="sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle">reuse weak creds</text>
  <line x1="610" y1="170" x2="640" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#sap-arrow-gray)"/>
  <text x="668" y="215" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">no path</text>
  <circle cx="110" cy="150" r="40" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="110" y="146" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">attacker</text>
  <text x="110" y="163" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">external</text>
  <circle cx="330" cy="150" r="50" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="330" y="143" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">VPN gateway</text>
  <text x="330" y="160" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">unpatched RCE</text>
  <circle cx="570" cy="150" r="50" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="570" y="143" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">file server</text>
  <text x="570" y="160" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">weak creds</text>
  <circle cx="640" cy="290" r="50" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="640" y="285" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">printer</text>
  <text x="640" y="302" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">dead end</text>
  <rect x="470" y="200" width="140" height="60" rx="10" fill="#b91c1c"/>
  <text x="540" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">customer DB</text>
  <text x="540" y="243" font-family="sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">CROWN JEWEL</text>
  <text x="420" y="150" font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"> </text>
  <text x="24" y="320" font-family="sans-serif" font-size="13" fill="#475569">Path length 3 to the crown jewel. Patch the choke point (gateway) and the path breaks.</text>
</svg>

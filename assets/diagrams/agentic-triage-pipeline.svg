<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Agentic AI triage pipeline with guardrails">
<defs><marker id="ah3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="900" height="320" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">Agentic Triage Pipeline (Guarded)</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<rect x="30" y="110" width="150" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="105" y="136" fill="#38bdf8" font-weight="bold">Planner (LLM)</text><text x="105" y="156" fill="#94a3b8">plan -&gt; act -&gt;</text><text x="105" y="172" fill="#94a3b8">observe -&gt; replan</text>
<rect x="220" y="110" width="170" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="305" y="136" fill="#22c55e" font-weight="bold">Read tools</text><text x="305" y="156" fill="#94a3b8">SIEM, assets, intel</text><text x="305" y="172" fill="#94a3b8">freely granted</text>
<rect x="430" y="110" width="170" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="515" y="136" fill="#fbbf24" font-weight="bold">Human gate</text><text x="515" y="156" fill="#94a3b8">approve destructive</text><text x="515" y="172" fill="#94a3b8">actions</text>
<rect x="640" y="110" width="150" height="70" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="715" y="136" fill="#f97316" font-weight="bold">Action tools</text><text x="715" y="156" fill="#94a3b8">isolate, block</text><text x="715" y="172" fill="#94a3b8">gated, allowlisted</text>
<rect x="220" y="220" width="570" height="56" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/><text x="505" y="244" fill="#e2e8f0" font-weight="bold">Audit log: every plan, tool call, and approval replayable</text><text x="505" y="262" fill="#94a3b8">+ step budgets, loop detection, kill switch</text>

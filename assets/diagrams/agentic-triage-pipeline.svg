<line x1="180" y1="145" x2="216" y2="145" marker-end="url(#ah3)"/><line x1="390" y1="145" x2="426" y2="145" marker-end="url(#ah3)"/><line x1="600" y1="145" x2="636" y2="145" marker-end="url(#ah3)"/>
</g>
<text x="450" y="300" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Enrich freely. Propose actions. Execute only with approval. The tool belt is the blast radius.</text>

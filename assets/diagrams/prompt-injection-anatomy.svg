<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Prompt injection anatomy">
<defs><marker id="ah4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="900" height="320" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">Prompt Injection Anatomy</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<rect x="40" y="100" width="220" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
<text x="150" y="126" fill="#22c55e" font-weight="bold">System instruction</text>
<text x="150" y="148" fill="#cbd5e1">trusted policy:</text><text x="150" y="166" fill="#cbd5e1">summarize tickets,</text><text x="150" y="184" fill="#cbd5e1">never exfiltrate</text>
<rect x="340" y="100" width="220" height="90" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
<text x="450" y="126" fill="#f97316" font-weight="bold">Untrusted data</text>
<text x="450" y="148" fill="#cbd5e1">ticket body hides:</text><text x="450" y="166" fill="#cbd5e1">"ignore previous</text><text x="450" y="184" fill="#cbd5e1">instructions..."</text>
<rect x="640" y="100" width="220" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="750" y="126" fill="#38bdf8" font-weight="bold">Model</text>
<text x="750" y="148" fill="#cbd5e1">cannot tell instruction</text><text x="750" y="166" fill="#cbd5e1">from data --</text><text x="750" y="184" fill="#cbd5e1">follows the ticket</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none">
<line x1="260" y1="145" x2="336" y2="145" marker-end="url(#ah4)"/><line x1="560" y1="145" x2="636" y2="145" marker-end="url(#ah4)"/>
</g>
<line x1="340" y1="80" x2="340" y2="210" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
<text x="340" y="70" text-anchor="middle" fill="#f97316" font-size="12" font-family="sans-serif">trust boundary (fails here)</text>
<g font-family="sans-serif" font-size="12" text-anchor="middle">
<rect x="180" y="230" width="540" height="52" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1"/>
<text x="450" y="252" fill="#94a3b8">Defense: sanitize untrusted content, enforce instruction hierarchy,</text>
<text x="450" y="270" fill="#94a3b8">gate sensitive actions behind human approval.</text>
</g>
</svg>
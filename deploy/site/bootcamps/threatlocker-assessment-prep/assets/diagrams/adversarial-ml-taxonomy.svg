<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Adversarial ML taxonomy">
<rect width="900" height="360" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">Adversarial ML Taxonomy</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<rect x="330" y="60" width="240" height="50" rx="10" fill="#1e293b" stroke="#f1f5f9" stroke-width="2"/><text x="450" y="90" fill="#f1f5f9" font-weight="bold">Attacks on ML Systems</text>
<rect x="40" y="150" width="180" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="130" y="174" fill="#38bdf8" font-weight="bold">Evasion</text><text x="130" y="194" fill="#94a3b8">fool the deployed model</text>
<rect x="250" y="150" width="180" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="340" y="174" fill="#38bdf8" font-weight="bold">Extraction</text><text x="340" y="194" fill="#94a3b8">steal the model</text>
<rect x="460" y="150" width="180" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="550" y="174" fill="#38bdf8" font-weight="bold">Inversion</text><text x="550" y="194" fill="#94a3b8">steal the training data</text>
<rect x="150" y="250" width="180" height="60" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="240" y="274" fill="#fbbf24" font-weight="bold">Poisoning</text><text x="240" y="294" fill="#94a3b8">corrupt training data</text>
<rect x="360" y="250" width="180" height="60" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="450" y="274" fill="#fbbf24" font-weight="bold">Backdoors</text><text x="450" y="294" fill="#94a3b8">hidden triggers</text>
<rect x="570" y="250" width="180" height="60" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="660" y="274" fill="#f97316" font-weight="bold">Prompt injection</text><text x="660" y="294" fill="#94a3b8">hijack LLM / agent</text>
</g>
<g stroke="#64748b" stroke-width="1.5">
<line x1="450" y1="110" x2="130" y2="148"/><line x1="450" y1="110" x2="340" y2="148"/><line x1="450" y1="110" x2="550" y2="148"/>
<line x1="450" y1="110" x2="240" y2="248"/><line x1="450" y1="110" x2="450" y2="248"/><line x1="450" y1="110" x2="660" y2="248"/>
</g>
<text x="450" y="336" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Blue = test-time (deployed model). Amber = train-time (data supply). Orange = LLM-specific. When it lands decides how you defend.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Supervised vs unsupervised detection pipelines">
<rect width="900" height="340" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">Supervised vs Unsupervised Detection</text>
<g font-family="sans-serif" font-size="13">
<text x="40" y="70" fill="#fbbf24" font-weight="bold">SUPERVISED</text>
<text x="40" y="90" fill="#94a3b8">learns the boundary between labeled classes</text>
<g text-anchor="middle">
<rect x="40" y="110" width="150" height="56" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="115" y="132" fill="#e2e8f0">Labeled data</text><text x="115" y="150" fill="#94a3b8">malware / benign</text>
<rect x="230" y="110" width="150" height="56" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="305" y="132" fill="#e2e8f0">Classifier</text><text x="305" y="150" fill="#94a3b8">trees / boosting</text>
<rect x="420" y="110" width="150" height="56" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="495" y="132" fill="#e2e8f0">Known threats</text><text x="495" y="150" fill="#94a3b8">high precision</text>
<rect x="610" y="110" width="150" height="56" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/><text x="685" y="132" fill="#e2e8f0">Blind spot</text><text x="685" y="150" fill="#94a3b8">novel attacks</text>
</g>
<text x="40" y="210" fill="#38bdf8" font-weight="bold">UNSUPERVISED</text>
<text x="40" y="230" fill="#94a3b8">learns normal, flags deviation</text>
<g text-anchor="middle">
<rect x="40" y="250" width="150" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="115" y="272" fill="#e2e8f0">Baseline</text><text x="115" y="290" fill="#94a3b8">normal behavior</text>
<rect x="230" y="250" width="150" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="305" y="272" fill="#e2e8f0">Anomaly scores</text><text x="305" y="290" fill="#94a3b8">isolation / LOF</text>
<rect x="420" y="250" width="150" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="495" y="272" fill="#e2e8f0">Novelty caught</text><text x="495" y="290" fill="#94a3b8">zero-days</text>
<rect x="610" y="250" width="150" height="56" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/><text x="685" y="272" fill="#e2e8f0">Cost</text><text x="685" y="290" fill="#94a3b8">more false positives</text>
</g>
</g>
<text x="450" y="328" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Hybrid pattern: unsupervised nominates, supervised (and the analyst) convicts.</text>
</svg>
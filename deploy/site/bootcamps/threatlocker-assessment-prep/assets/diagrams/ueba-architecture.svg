<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="UEBA architecture: baselining, scoring, alerting">
<rect width="900" height="300" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">UEBA Architecture</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<rect x="30" y="100" width="240" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="150" y="128" fill="#38bdf8" font-weight="bold">1. BASELINING</text>
<text x="150" y="150" fill="#cbd5e1">learn normal per</text><text x="150" y="168" fill="#cbd5e1">user / entity / peer group</text><text x="150" y="186" fill="#94a3b8">logons, volumes, hours</text>
<rect x="330" y="100" width="240" height="110" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
<text x="450" y="128" fill="#fbbf24" font-weight="bold">2. SCORING</text>
<text x="450" y="150" fill="#cbd5e1">measure deviation:</text><text x="450" y="168" fill="#cbd5e1">z-scores, sequence models</text><text x="450" y="186" fill="#94a3b8">HMMs / LSTMs on action order</text>
<rect x="630" y="100" width="240" height="110" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
<text x="750" y="128" fill="#f97316" font-weight="bold">3. ALERTING</text>
<text x="750" y="150" fill="#cbd5e1">aggregate weak signals</text><text x="750" y="168" fill="#cbd5e1">into cases</text><text x="750" y="186" fill="#94a3b8">identity-centric timeline</text>
</g>
<g stroke="#64748b" stroke-width="2"><defs><marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<line x1="270" y1="155" x2="326" y2="155" marker-end="url(#ah2)"/><line x1="570" y1="155" x2="626" y2="155" marker-end="url(#ah2)"/></g>
<text x="450" y="250" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Telemetry in (auth, VPN, EDR, cloud) -- peer groups kill false positives -- service accounts get baselines too.</text>
<text x="450" y="272" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Follow the identity across devices: the credential is the attacker's vehicle.</text>
</svg>
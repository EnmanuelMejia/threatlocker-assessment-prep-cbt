<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="ML lifecycle for security: six stages in a loop">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f97316"/></marker></defs>
<rect width="900" height="300" fill="#0f172a"/>
<text x="450" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-family="sans-serif" font-weight="bold">ML Lifecycle for Security</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<g><rect x="20" y="110" width="120" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="80" y="140" fill="#fbbf24" font-weight="bold">1. Scope</text><text x="80" y="160" fill="#cbd5e1">decision, costs,</text><text x="80" y="178" fill="#cbd5e1">success metric</text></g>
<g><rect x="170" y="110" width="120" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="230" y="140" fill="#fbbf24" font-weight="bold">2. Data</text><text x="230" y="160" fill="#cbd5e1">collect, label,</text><text x="230" y="178" fill="#cbd5e1">version</text></g>
<g><rect x="320" y="110" width="120" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="380" y="140" fill="#fbbf24" font-weight="bold">3. Train</text><text x="380" y="160" fill="#cbd5e1">fit, validate,</text><text x="380" y="178" fill="#cbd5e1">no leakage</text></g>
<g><rect x="470" y="110" width="120" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="530" y="140" fill="#fbbf24" font-weight="bold">4. Deploy</text><text x="530" y="160" fill="#cbd5e1">score -&gt; policy</text><text x="530" y="178" fill="#cbd5e1">(block/alert/log)</text></g>
<g><rect x="620" y="110" width="120" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="680" y="140" fill="#fbbf24" font-weight="bold">5. Monitor</text><text x="680" y="160" fill="#cbd5e1">precision/recall,</text><text x="680" y="178" fill="#cbd5e1">drift alarms</text></g>
<g><rect x="770" y="110" width="110" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/><text x="825" y="140" fill="#fbbf24" font-weight="bold">6. Retire</text><text x="825" y="160" fill="#cbd5e1">or retrain</text></g>
</g>
<g stroke="#f97316" stroke-width="2" marker-end="url(#ah)">
<line x1="140" y1="150" x2="166" y2="150"/><line x1="290" y1="150" x2="316" y2="150"/><line x1="440" y1="150" x2="466" y2="150"/><line x1="590" y1="150" x2="616" y2="150"/><line x1="740" y1="150" x2="766" y2="150"/>
</g>
<path d="M825 190 C 825 250, 80 250, 80 194" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ah)"/>
<text x="450" y="272" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="sans-serif">retrain loop: monitoring feeds fresh labels back to data</text>
<text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Every stage is a control point. Most failures are stage 1, 2, or 5 -- never the model.</text>
</svg>